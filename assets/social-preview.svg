<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="spAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <!-- Glowing Auroras -->
    <radialGradient id="auroraTopRight" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraBottomLeft" cx="15%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0E7490" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glowPulse" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="640" fill="url(#spBg)" />
  <rect width="1280" height="640" fill="url(#auroraTopRight)" />
  <rect width="1280" height="640" fill="url(#auroraBottomLeft)" />

  <!-- Subtle High-Tech Grid Matrix -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="560" x2="1280" y2="560" />

    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
  </g>

  <!-- Outer Canvas Border -->
  <rect x="2" y="2" width="1276" height="636" rx="20" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- LEFT SECTION: Branding & Text Info -->
  <g transform="translate(80, 80)">
    <!-- Top Pill: Model Context Protocol -->
    <g transform="translate(0, 0)">
      <rect width="270" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <circle cx="16" cy="16" r="6" fill="#10B981" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" letter-spacing="1.2">MODEL CONTEXT PROTOCOL</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 95)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="64" font-weight="900" fill="url(#textGrad)" letter-spacing="-1.5">
        Viewport<tspan fill="url(#spAccent)">IQ</tspan>
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <g transform="translate(0, 155)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94A3B8" letter-spacing="-0.3">
        Browser Inspection &amp; Responsive Testing
      </text>
      <text y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#64748B">
        Built for Claude Desktop, Cursor, Cline &amp; MCP-compatible AI assistants
      </text>
    </g>

    <!-- Key Metrics Grid -->
    <g transform="translate(0, 245)">
      <!-- Metric 1 -->
      <g filter="url(#cardShadow)">
        <rect width="135" height="72" rx="12" fill="#111827" stroke="#3730A3" stroke-width="1.5" />
        <text x="16" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800" fill="#A5B4FC">17</text>
        <text x="16" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#64748B">MCP Tools</text>
      </g>

      <!-- Metric 2 -->
      <g transform="translate(150, 0)" filter="url(#cardShadow)">
        <rect width="135" height="72" rx="12" fill="#111827" stroke="#0E7490" stroke-width="1.5" />
        <text x="16" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800" fill="#38BDF8">7</text>
        <text x="16" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#64748B">Device Presets</text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(300, 0)" filter="url(#cardShadow)">
        <rect width="135" height="72" rx="12" fill="#111827" stroke="#065F46" stroke-width="1.5" />
        <text x="16" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800" fill="#34D399">100%</text>
        <text x="16" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#64748B">Local &amp; Private</text>
      </g>
    </g>

    <!-- Author Attribution -->
    <g transform="translate(0, 360)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748B">
        Open Source on GitHub: <tspan fill="#38BDF8">github.com/Opitien/Viewport-iq</tspan>
      </text>
    </g>
  </g>

  <!-- RIGHT SECTION: Visual Mockup / Glass Card Visualizer -->
  <g transform="translate(710, 100)" filter="url(#cardShadow)">
    <!-- Base Card Container -->
    <rect width="490" height="440" rx="24" fill="#0E1626" fill-opacity="0.8" stroke="#334155" stroke-width="2" />

    <!-- Card Header / Title Bar -->
    <path d="M 0 52 L 490 52" stroke="#1E293B" stroke-width="2" />
    <circle cx="28" cy="26" r="6" fill="#EF4444" />
    <circle cx="48" cy="26" r="6" fill="#F59E0B" />
    <circle cx="68" cy="26" r="6" fill="#10B981" />
    <rect x="100" y="16" width="220" height="20" rx="10" fill="#1E293B" />
    <text x="120" y="30" font-family="monospace" font-size="11" fill="#64748B">viewport-iq: session-active</text>

    <!-- Nested Responsive Preview inside Card -->
    <!-- Desktop Viewport Outline -->
    <rect x="35" y="80" width="300" height="190" rx="12" fill="#131D31" stroke="url(#spAccent)" stroke-width="2.5" />
    <!-- Header bar -->
    <line x1="35" y1="105" x2="335" y2="105" stroke="#1E293B" stroke-width="2" />
    <!-- Mock layout columns -->
    <rect x="50" y="120" width="80" height="130" rx="6" fill="#1E293B" />
    <rect x="140" y="120" width="180" height="60" rx="6" fill="#1E293B" />
    <rect x="140" y="190" width="180" height="60" rx="6" fill="#1E293B" />

    <!-- Overlapping Mobile Screen Preview -->
    <g transform="translate(260, 140)" filter="url(#cardShadow)">
      <rect width="180" height="260" rx="20" fill="#0B0F19" stroke="url(#spAccent)" stroke-width="3" />
      <!-- Notch -->
      <rect x="65" y="10" width="50" height="5" rx="2.5" fill="#334155" />
      <!-- Screen elements -->
      <rect x="20" y="35" width="140" height="24" rx="6" fill="#1E293B" />
      <rect x="20" y="68" width="140" height="80" rx="8" fill="#1E293B" />
      <line x1="30" y1="90" x2="110" y2="90" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
      <line x1="30" y1="105" x2="130" y2="105" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
      <line x1="30" y1="120" x2="90" y2="120" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />

      <!-- Caliper / Overflow Marker on Mobile -->
      <rect x="20" y="160" width="140" height="70" rx="8" fill="#131D31" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 2" />
      <text x="32" y="188" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#F87171">OVERFLOW DETECTED</text>
      <text x="32" y="208" font-family="monospace" font-size="10" fill="#94A3B8">+135px past boundary</text>
    </g>

    <!-- Live Scanner Indicator Pill -->
    <g transform="translate(45, 380)">
      <rect width="200" height="34" rx="17" fill="#111827" stroke="#10B981" stroke-width="1.5" />
      <circle cx="18" cy="17" r="4" fill="#10B981" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Playwright Chromium Active</text>
    </g>
  </g>
</svg>
